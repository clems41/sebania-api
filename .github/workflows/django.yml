name: Django CI

on:
  push:
    branches: [ "dev", "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Create empty .env file for Docker Compose
        run: touch .env
      - name: Create testing database and run testcases using Docker Compose
        run: docker compose up --build db testcases --abort-on-container-exit --exit-code-from testcases
      - name: Destroy testing database
        run: docker compose down -v
