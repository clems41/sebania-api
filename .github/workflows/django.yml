name: Django CI

on:
  push:
    branches: [ "dev", "master" ]
  pull_request:
    branches: [ "master" ]


env:
  DATABASE_NAME: sebania
  DATABASE_USERNAME: sebania
  DATABASE_PASSWORD: sebania
  COMPOSE_BAKE: true
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: sebania:0.1.0


  testcases:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Create testing database and run testcases using Docker Compose
        run: docker compose up --build db testcases --abort-on-container-exit --exit-code-from testcases
      - name: Destroy testing database
        run: docker compose down -v
