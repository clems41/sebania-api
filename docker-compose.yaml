services:
  db:
    container_name: sebania-db
    image: postgres:17
    ports:
      - "5432:5432"
    volumes:
      - sebania_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'"]
      interval: 10s
      timeout: 3s
      retries: 3
    environment:
      POSTGRES_PASSWORD: sebania
      POSTGRES_USER: sebania
      POSTGRES_DB: sebania

  api:
    build: .
    container_name: sebania-api
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: sebania.settings.local
      DATABASE_HOST: db
    env_file:
      - .env

  testcases:
    build:
      dockerfile: ./Dockerfile.test
    container_name: sebania-testcases
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  sebania_data: