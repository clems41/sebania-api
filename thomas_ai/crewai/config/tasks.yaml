transcription_improvement:
  description: >
    Analyse une transcription brute issue de Whisper contenant le message vocal d’un maraîcher en respectant les contraintes suivantes :
    1. Corriger les erreurs éventuelles de grammaire ou d'orthographe pour en faire des phrases simples et claires. Tu ne dois pas changer le sens des phrases ou remplacer des mots si la phrase initiale est correcte.
    2. Remplacer les mots incorrectement transcrits par des mots ayant une sonorité proche et un sens dans le contexte du maraîchage (outils, tâches, cultures, etc.).
    3. Découper le texte final en paragraphes, chaque paragraphe correspondant à une tâche réalisée par le maraîcher.
    4. Garder un style fluide et oral, sans ajouter d’informations inventées.
    5. Si une seule tâche est décrite, le texte ne contiendra qu’un seul paragraphe.
    6. Si une tâche est floue, reformule-la pour la clarifier sans changer son sens.
    7. Enlève les signes de politesse (bonjour, au revoir, etc.) pour ne garder que les informations essentielles.
    
    **Début de la transcription brute**
    {transcription}
    **Fin de la transcription brute**
  expected_output: >
    Un texte propre, structuré par tâches, lisible, fluide, et corrigé grammaticalement, avec les mots mal transcrits remplacés intelligemment selon leur contexte sonore et sémantique.
    Exemple :
    **Tâche 1 – Récolte des radis**
    Ce matin, j’ai récolté les radis dans la planche 3. Ils étaient bien développés, malgré les pluies de ces derniers jours.

    **Tâche 2 – Désherbage manuel**
    Ensuite, j’ai désherbé à la main autour des carottes. Il y avait pas mal d’herbe, surtout du pourpier et un peu de chiendent.

  agent: transcription_improver

transcription_to_tasks:
  description: >
    Prends comme point de départ le résultat de la tâche précédente.
    
    Tu dois analyser un texte composé de plusieurs paragraphes, chacun représentant une action réalisée dans une journée par un maraîcher. Ton objectif est de transformer chaque paragraphe en une tâche structurée contenant les champs suivants :
    1. **activite** (obligatoire si identifiable) : nom de l'activité correspondante à la tâche. Elle doit être choisie uniquement parmi la liste suivante (une seule activité doit être choisie) : {activites}.
    2. **duree_minutes** (en minutes, exemple : "1h20" = 80 minutes) : extraire la durée mentionnée dans le paragraphe si elle est indiquée (sinon 0). Si plusieurs durées sont mentionnées, choisir celle correspondant à l’action principale décrite.
    3. **parcelles** : indiquer la localisation précise de l’action si elle est mentionnée (sinon []). La parcelle peut être de différents types : serre, planche, parcelle, champ, zone, etc.). L'action peut être effectuée sur plusieurs parcelles. Chaque parcelle doit être indiquée, séparées par une virgule. Les parcelles ne contiennent pas de nom de culture.
    4. **cultures** : liste de noms de culture si identifiable (sinon []). Chaque nom doit être choisi uniquement parmi la liste suivante : {cultures}.
    5. **quantite** : identifie si une quantité est citée (nombre uniquement, 0 si non précisé). Cette quantité doit être en lien avec la tâche réalisée (exemple : 5kg = 5, 12,5 litres = 12.5). 
    5. **unite** : identifie si une unité est précisée avec le champ 'quantite' (sinon ''). Cette unité doit être choisie uniquement parmi la liste suivante (une seule unité doit être choisie) : {unites}.
    5. **commentaire** : ajout des autres informations fournies dans la transcription, mais uniquement si elles ne correspondent pas à aucun autre champ (par exemple, contexte, météo, outils utilisés, impressions, etc.). Ne pas dupliquer d’informations déjà classées dans un champ ci-dessus. Ne pas supposer ou inventer d'informations, se baser uniquement sur la transcription.
    
    **Contraintes importantes :**
    - Tous les champs doivent être présents pour chaque tâche, même s’ils sont vides.
    - Si une information n’est pas clairement identifiable dans le paragraphe, laisse le champ vide.
    - Le format de sortie attendu est une liste de dictionnaires JSON, un par paragraphe analysé.
    - Ne crée pas de tâche dans le fichier JSON si tu n'arrives pas à identifier le champ 'activite'.
    - Détecter les corrections de durée ("non en fait c'était 1h" → 60 minutes).
    - Il t’est interdit de combler les informations manquantes. 
    - Si plusieurs activités correspondent à un paragraphe, choisis celle qui te paraît la plus pertinente par rapport à ce qui est dit dans le paragraphe en question. Un paragraphe ne doit donner qu'un seul objet dans la liste finale du fichier JSON.
    - N'ajoute qu'une seule culture par nom donné par le maraîcher dans la transcription. Par exemple, si le maraîcher parle de 'choux', prends un type de chou de la liste et un seul, n'ajoute pas tous les choux que tu trouves dans la liste des cultures.
    - Les parcelles doivent ressembler à des noms donnés par les maraîchers, exemple : "Tunnel 2", "Serre 1", "Parcelle 14", etc. Si tu n'as pas cette information, ne la renseigne pas.
    - 

  expected_output: >
    Une liste de tâches au format JSON ou tableau, avec les champs mentionnés pour chaque paragraphe du texte. Le fichier généré doit être écrit exclusivement en français.
    Exemple :
    [
      {
        "activite": "Récolte",
        "duree_minutes": 120,
        "parcelles": ["serre 2", "tunnel 1"],
        "quantite": 120,
        "unite": "kg",
        "cultures": ["Courge musquée", "Concombre"],
        "commentaire": "Désherbage pendant la récolte et discussion avec le voisin."
      },
      {
        "activite": "Charger / Décharger",
        "duree_minutes": 25,
        "parcelles": [],
        "cultures": ["Courgette"],
        "quantite": 3,
        "unite": "caisses",
        "commentaire": "Chargement des commandes AMAP."
      },
      {
        "activite": "Accueil du public",
        "duree_minutes": 60,
        "parcelles": [],
        "cultures": [],
        "quantite": 0,
        "unite": "",
        "commentaire": ""
      }
    ]
  agent: task_manager
